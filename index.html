<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FEM vs Projective Dynamics</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14171c; color: #dfe5ee;
      font-family: system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
    :root { --gui-w: 260px; --plot-h: 0px; } /* space reserved for the parameter GUI (0 when collapsed) */
    #stage { position: fixed; left: 0; top: 0; bottom: var(--plot-h); right: var(--gui-w); }
    #plots { position: fixed; left: 0; bottom: 0; height: var(--plot-h); right: var(--gui-w); display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
      background: #3a4250; border-top: 1px solid #3a4250; }
    #plots > div { background: #14171c; min-width: 0; min-height: 0; overflow: hidden; }
    #plots { overflow: hidden; }
    #canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    #divider { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #3a4250; }
    .panel { position: absolute; top: 0; width: 50%; padding: 10px 14px; box-sizing: border-box; pointer-events: none; }
    #panel-fem { left: 0; }
    #panel-pd { left: 50%; }
    .lil-gui.root { z-index: 10; }
    .panel h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
    .panel .sub { font-size: 12px; color: #93a0b4; }
    .panel pre { margin: 6px 0 0; font: 12px/1.5 ui-monospace, Consolas, monospace; color: #c9d3e2; }
    #legend { position: fixed; left: 14px; bottom: calc(10px + var(--plot-h)); font-size: 12px; color: #93a0b4; display: flex; gap: 8px; align-items: center; }
    #legend .bar { width: 120px; height: 10px; border-radius: 2px; background: linear-gradient(90deg, #8cbff2, #f2c14e, #e8452f); }
  </style>
  <!-- Libraries are loaded from a CDN with pinned versions (no build step), so the page also works on GitHub Pages.
       `npm install` is only needed for the unit tests. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.21.0/dist/lil-gui.esm.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage">
  <canvas id="canvas"></canvas>
  <div id="divider"></div>
  <div class="panel" id="panel-fem">
    <h2 id="title-fem">Corotational FEM</h2>
    <div class="sub" id="sub-fem">implicit Euler, warped stiffness, CG</div>
    <pre id="stats-fem"></pre>
  </div>
  <div class="panel" id="panel-pd">
    <h2 id="title-pd">Projective Dynamics</h2>
    <div class="sub" id="sub-pd">local/global, pre-factored Cholesky</div>
    <pre id="stats-pd"></pre>
  </div>
  </div>
  <div id="plots"><div id="plot-force"></div><div id="plot-det"></div></div>
  <div id="legend"><span>strain ‖F−R‖</span><span>0</span><span class="bar"></span><span id="legend-max"></span></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
